<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" font-family="Roboto,Arial,sans-serif" font-size="15">
  <title>Female reproductive system: textbook (coronal) view</title>
  <rect width="600" height="640" fill="#fffaf5"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#5a1a24">Female reproductive system (book view: front slice)</text>
  <!-- vagina -->
  <path d="M262 400h76l10 190h-96z" fill="#e59aa4" stroke="#8a3a46" stroke-width="2"/><path d="M285 400h30l5 190h-40z" fill="#8a3a46" opacity=".7"/>
  <!-- cervix + uterus -->
  <path d="M262 330c0-30-70-60-80-130 0-55 50-80 118-80s118 25 118 80c-10 70-80 100-80 130z" fill="#d9737f" stroke="#8a3a46" stroke-width="2"/>
  <path d="M300 160c40 0 70 20 66 60-10 40-45 70-52 110h-28c-7-40-42-70-52-110-4-40 26-60 66-60z" fill="#ffb0bc" stroke="#b33a4a" stroke-width="1.5"/>
  <path d="M300 160c25 0 45 15 42 45-8 28-32 50-42 80-10-30-34-52-42-80-3-30 17-45 42-45z" fill="#7a1f2e" opacity=".55"/>
  <rect x="293" y="330" width="14" height="70" rx="6" fill="#4a1018"/>
  <!-- tubes + fimbriae -->
  <g fill="none" stroke="#f0a0b0" stroke-width="16" stroke-linecap="round"><path d="M190 150c-40-30-80-30-110 0"/><path d="M410 150c40-30 80-30 110 0"/></g>
  <g fill="#f5b8c4" stroke="#b33a4a"><path d="M80 150l-26 14 8 14zM80 150l-20 28 14 4zM80 150l-8 34 14-4z"/><path d="M520 150l26 14-8 14zM520 150l20 28-14 4zM520 150l8 34-14-4z"/></g>
  <!-- ovaries -->
  <ellipse cx="62" cy="220" rx="42" ry="28" fill="#f0d98a" stroke="#a88a2a" stroke-width="2"/><circle cx="50" cy="214" r="7" fill="#fff"/><circle cx="72" cy="226" r="5" fill="#fff"/>
  <ellipse cx="538" cy="220" rx="42" ry="28" fill="#f0d98a" stroke="#a88a2a" stroke-width="2"/><circle cx="550" cy="214" r="7" fill="#fff"/><circle cx="526" cy="226" r="5" fill="#fff"/>
  <path d="M190 190c-50 10-90 20-90 35M410 190c50 10 90 20 90 35" fill="none" stroke="#e8d49a" stroke-width="4"/>
  <!-- labels -->
  <g fill="#3a0f18" stroke="#3a0f18" stroke-width=".6">
    <path d="M300 120v-20M110 100l-30 40M490 100l30 40M300 300h130M300 360h130M300 470h130M62 255v38M538 255v38M245 200l-110 30" fill="none"/>
    <text x="300" y="92" text-anchor="middle" stroke="none">Fundus + uterine cavity (endometrium)</text><text x="75" y="92" stroke="none" text-anchor="middle">Fimbriae</text><text x="525" y="92" stroke="none" text-anchor="middle">Fallopian tube</text>
    <text x="436" y="305" stroke="none">Myometrium</text><text x="436" y="365" stroke="none">Cervix</text><text x="436" y="475" stroke="none">Vagina</text><text x="62" y="310" text-anchor="middle" stroke="none">Ovary</text><text x="538" y="310" text-anchor="middle" stroke="none">Ovary</text><text x="150" y="250" stroke="none">Ovarian ligament</text>
  </g>
  <text x="300" y="625" text-anchor="middle" font-size="13" fill="#7a4a52">Book = flat FRONT view. In the body the uterus tilts forward over the bladder (see the atlas Book/Body button).</text>
</svg>
