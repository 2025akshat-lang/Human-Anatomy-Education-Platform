<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Roboto,Arial,sans-serif" font-size="15">
  <title>Male reproductive system: sagittal view</title>
  <rect width="640" height="600" fill="#f7fbff"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a3a5a">Male reproductive system (side view, face to the left)</text>
  <path d="M520 60c30 120 30 240-10 360" fill="none" stroke="#e9e2cf" stroke-width="26" stroke-linecap="round"/>
  <rect x="120" y="190" width="26" height="110" rx="8" fill="#e9e2cf" stroke="#b0a888"/>
  <path d="M470 90c40 120 50 260 10 420" fill="none" stroke="#b86a5a" stroke-width="48" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="260" cy="170" rx="92" ry="78" fill="#d9736b" stroke="#8a2f2a" stroke-width="2" opacity=".75"/><ellipse cx="260" cy="170" rx="70" ry="56" fill="#f0a0a0" opacity=".7"/>
  <ellipse cx="318" cy="150" rx="22" ry="48" transform="rotate(25 318 150)" fill="#e3b064" stroke="#a87a2a"/>
  <ellipse cx="228" cy="282" rx="48" ry="42" fill="#d89a82" stroke="#8a5a42" stroke-width="2"/>
  <path d="M236 240v90c0 20-10 40-50 62" fill="none" stroke="#f2e08a" stroke-width="9" stroke-linecap="round"/>
  <path d="M190 392c-70 30-150 60-170 100" fill="none" stroke="#c05a64" stroke-width="30" stroke-linecap="round"/><path d="M190 410c-70 30-150 60-168 100" fill="none" stroke="#b96568" stroke-width="16" stroke-linecap="round"/><ellipse cx="18" cy="500" rx="22" ry="18" fill="#e1b0a6"/>
  <ellipse cx="205" cy="470" rx="46" ry="62" fill="#e8c998" stroke="#a88a52" stroke-width="2"/><path d="M240 420c20 30 20 70 0 110" fill="none" stroke="#d9a76f" stroke-width="14" stroke-linecap="round"/>
  <path d="M215 420c-10-80 10-170 60-250s80-90 56-20" fill="none" stroke="#e7d29b" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 0"/>
  <g stroke="#1a3a5a" stroke-width="1" fill="#1a3a5a"><path d="M260 90l-40-30M318 105l60-40M228 330l-120 30M205 520l-130 40M470 300h-60M90 245l-60-20" fill="none"/>
    <text x="150" y="52" stroke="none">Bladder</text><text x="384" y="62" stroke="none">Seminal vesicle</text><text x="40" y="372" stroke="none">Prostate</text><text x="30" y="560" stroke="none">Testis + epididymis</text><text x="476" y="304" stroke="none">Rectum</text><text x="20" y="222" stroke="none">Pubic symphysis</text>
    <text x="170" y="440" stroke="none" text-anchor="end">Penis</text></g>
  <text x="320" y="590" text-anchor="middle" font-size="13" fill="#4a6a8a">Sperm path: testis > epididymis > vas deferens > ejaculatory duct > urethra</text>
</svg>
